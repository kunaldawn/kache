# kache - load balancer for the compose cluster.
#
# This is an http-context fragment, not a whole nginx.conf: it is mounted
# into /etc/nginx/conf.d, which the image's stock nginx.conf includes from
# inside http { }.
#
# It is only a round robin, and that is the point.  Every node holds a
# full copy, so a read is answered wherever it lands and needs no routing
# at all - which makes a plain balancer a complete client for the read
# path, with no topology for anyone to learn.
#
# Writes are not symmetric: a key's writes belong to one owner, and a node
# that does not own the key answers 307 naming it.  There is nothing to
# rewrite here because the nodes are started with -U and already name an
# address the client can reach, so a client that follows redirects -
# curl -L, or any HTTP library at its defaults - lands on the owner and
# talks to it directly, with nginx no longer in the path.

upstream kache_all {
	server kache0:7070 max_fails=2 fail_timeout=5s;
	server kache1:7070 max_fails=2 fail_timeout=5s;
	server kache2:7070 max_fails=2 fail_timeout=5s;
	# Without this nginx opens a fresh connection per request and the
	# cluster spends its time in accept().  kache holds connections for
	# CFG_IDLE_MS and is happy to be kept alive.
	keepalive 128;
}

server {
	listen 8080 default_server;
	server_name _;

	access_log off;

	# A value can be up to -V bytes, 256k by default, and nginx would
	# otherwise answer 413 above its own 1m default.  0 means do not
	# enforce a limit kache enforces itself.
	client_max_body_size 0;

	location / {
		proxy_pass http://kache_all;
		proxy_http_version 1.1;
		# Emptying Connection is what lets the upstream keepalive
		# above actually be used; the default forwards the client's
		# "close" and retires the pooled connection every time.
		proxy_set_header Connection "";
		proxy_set_header Host $host;

		# A 307 from a node already names an address the client can
		# reach, because of -U, so it is passed through untouched.
		proxy_redirect off;

		# A node that is down should cost one retry, not a hung
		# request: the next node holds the same data.
		proxy_next_upstream error timeout http_502 http_503;
		proxy_connect_timeout 2s;
	}
}
